name: Security Scan
on:
  # Push em qualquer branch.
  # Feature branches executam quick scan; main/develop executam full scan.
  push:
  # Permite execução manual.
  workflow_dispatch:
concurrency:
  group: sec-scan-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quick-scan:
    name: Quick Security Scan
    if: >
      github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop'

    uses: kunumi/org-security/.github/workflows/secret-scan-reusable.yml@main
    with:
      scan_level: quick
    secrets:
      KREPORTS_TOKEN: ${{ secrets.KREPORTS_TOKEN }}
      DD_TOKEN: ${{ secrets.DD_TOKEN }}
  full-scan:
    name: Full Security Scan
    if: >
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (

        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/develop'
        )
      )

    uses: kunumi/org-security/.github/workflows/secret-scan-reusable.yml@main
    with:
      scan_level: full
    secrets:
      KREPORTS_TOKEN: ${{ secrets.KREPORTS_TOKEN }}
      DD_TOKEN: ${{ secrets.DD_TOKEN }}
